name: Publish WordPress plugin release

on:
  push:
    branches: [main]
    paths:
      - 'site-toolkit-for-bricks.php'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*\* Version: \([0-9][0-9.]*\).*/\1/p' site-toolkit-for-bricks.php | head -1)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid plugin version: $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Package installable plugin ZIP
        run: |
          mkdir -p build/site-toolkit-for-bricks
          cp site-toolkit-for-bricks.php readme.txt LICENSE.txt build/site-toolkit-for-bricks/
          cp -R includes assets build/site-toolkit-for-bricks/
          cd build
          zip -qr ../site-toolkit-for-bricks.zip site-toolkit-for-bricks
          unzip -tq ../site-toolkit-for-bricks.zip
      - name: Publish GitHub Release with ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" site-toolkit-for-bricks.zip \
            --target "$GITHUB_SHA" \
            --title "Site Toolkit for Bricks ${{ steps.version.outputs.version }}" \
            --notes "Test release to verify GitHub updates from 1.3.0 to 1.3.1. No feature changes."